<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Time Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h2 {
            color: #333;
        }
        label {
            font-size: 16px;
            margin-top: 10px;
            display: block;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-top: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        .reset-btn {
            background-color: #28a745;
            margin-top: 10px;
        }
        .reset-btn:hover {
            background-color: #218838;
        }
        .result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Break Time Calculator</h2>

        <label for="timeInput">Select Time (or keep current time):</label>
        <input type="time" id="timeInput">

        <button class="reset-btn" onclick="setCurrentTime()">Reset to Current Time</button>

        <label for="breakDuration">Select Break Duration:</label>
        <select id="breakDuration">
            <option value="15">15 Minutes</option>
            <option value="45">45 Minutes</option>
        </select>

        <button onclick="calculateBreakEnd()">Calculate Break End Time</button>

        <h3 class="result" id="result"></h3>
    </div>

    <script>
        function setCurrentTime() {
            let now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById("timeInput").value = `${hours}:${minutes}`;
        }

        function calculateBreakEnd() {
            let selectedTime = document.getElementById("timeInput").value;
            let breakMinutes = parseInt(document.getElementById("breakDuration").value);

            if (!selectedTime) {
                alert("Please select a valid time.");
                return;
            }

            let [hours, minutes] = selectedTime.split(":").map(Number);
            let now = new Date();
            now.setHours(hours, minutes);

            now.setMinutes(now.getMinutes() + breakMinutes);

            let finalHours = now.getHours();
            let finalMinutes = now.getMinutes();
            let period = finalHours >= 12 ? "PM" : "AM";

            finalHours = finalHours % 12 || 12; 
            finalMinutes = finalMinutes < 10 ? "0" + finalMinutes : finalMinutes;

            document.getElementById("result").innerText = `Break Ends at: ${finalHours}:${finalMinutes} ${period}`;
        }

        // Set the current time on page load
        setCurrentTime();
    </script>

</body>
</html>
